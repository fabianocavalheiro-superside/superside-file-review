<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative review</title>
<link rel="icon" type="image/svg+xml" href="assets/brand/Superside_Logo_Icon_-_Pine.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Raleway:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ---------- Superside brand tokens (Borealis) ---------- */
:root{
  /* primitives */
  --pine-500:#0A211F; --pine-400:#0E2D2A;
  --cloud-100:#F7F9F2; --cloud-200:#EEF3E4; --cloud-300:#E6ECD6; --cloud-400:#DDE6C8;
  --spark-500:#D8FF85; --spark-800:#768C49;
  --mint-500:#8DFDBA;
  --leaf-500:#2A4E45; --leaf-600:#26473F;
  --peach-500:#FF9595; --peach-600:#E57777;

  --font-display:'Inter Tight',system-ui,sans-serif;
  --font-body:'Raleway',system-ui,sans-serif;
  --radius-pill:999px; --radius-card:16px; --radius-img:12px;

  /* LIGHT theme (default) */
  --primary:var(--pine-500);
  --background:var(--cloud-100);
  --base:var(--pine-500);
  --base-soft:rgba(10,33,31,.8);
  --base-softer:rgba(10,33,31,.5);
  --base-softest:rgba(10,33,31,.15);
  --success:var(--spark-800);
  --error:#B03C3C;                 /* peach-800, so error text stays readable on light surfaces */
  --text-button:var(--cloud-100);  /* label on a Pine primary button */
  --surface-default:var(--cloud-300);
  --surface-hover:var(--cloud-400);
  --hover-subtle:var(--cloud-200);
  --accent-fill:var(--spark-500);  /* Spark, used once per card */
  --accent-ink:var(--pine-500);
}
/* DARK theme, follows the reviewer's system setting */
@media (prefers-color-scheme:dark){
  :root{
    --primary:var(--spark-500);
    --background:var(--pine-500);
    --base:var(--cloud-100);
    --base-soft:rgba(247,249,242,.8);
    --base-softer:rgba(247,249,242,.5);
    --base-softest:rgba(247,249,242,.15);
    --success:var(--spark-500);
    --error:var(--peach-500);
    --text-button:var(--pine-500);
    --surface-default:var(--leaf-500);
    --surface-hover:var(--leaf-600);
    --hover-subtle:var(--pine-400);
  }
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--background);color:var(--base);font:400 16px/1.5 var(--font-body)}
h1,h2,h3{font-family:var(--font-display);font-weight:500;margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--base);outline-offset:3px}

/* ---------- buttons: pill, size S ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;
  border-radius:var(--radius-pill);font:400 14px var(--font-display);cursor:pointer;text-decoration:none;
  background:transparent;border:1px solid var(--base);color:var(--base);white-space:nowrap}
.btn--primary{background:var(--primary);border-color:transparent;color:var(--text-button);font-weight:500}
.btn--primary:hover{filter:brightness(1.12)}
.btn--isolated:hover{background:var(--primary);border-color:transparent;color:var(--text-button)}
.btn:disabled{opacity:.5;pointer-events:none}

/* ---------- header (logo | divider | project) ---------- */
.bar{position:sticky;top:0;z-index:10;background:var(--background);border-bottom:1px solid var(--base-softest);
  display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:14px clamp(16px,4vw,40px)}
.lockup{display:flex;align-items:center;gap:20px;margin-right:auto;min-width:0}
.logo{height:44px;width:auto;flex:none;color:var(--base)}
.rule{width:1px;align-self:stretch;background:var(--base-softer);min-height:32px}
.proj h1{font-size:20px;line-height:1.1}
.proj p{margin:2px 0 0;font-size:14px;color:var(--base-soft)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:12px}

/* ---------- text fields: outline style ---------- */
.field{height:46px;width:190px;padding:0 20px;border-radius:var(--radius-pill);background:transparent;
  border:1px solid var(--base-softest);font:400 14px var(--font-display)}
.field::placeholder,textarea::placeholder{color:var(--base-softer)}
.field:hover,textarea:hover{border-color:var(--base-softer)}
.field:focus,textarea:focus{border-color:var(--base);outline:none}
.field.error,textarea.error{border-color:var(--error)}
.sync{display:flex;align-items:center;gap:8px;font:400 14px var(--font-display);color:var(--base-soft)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--base-softer);flex:none}
.sync.ok i{background:var(--success)}
.sync.err{color:var(--error)}.sync.err i{background:var(--error)}

/* ---------- feed ---------- */
main{max-width:1280px;margin:0 auto;padding:40px clamp(16px,4vw,40px) 64px;display:grid;gap:32px}
.review{display:grid;grid-template-columns:minmax(0,1fr) 360px;background:var(--surface-default);
  border-radius:var(--radius-card);overflow:hidden}
.stage-wrap{display:flex;flex-direction:column;min-width:0}
.item-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:20px 24px}
.item-head h2{font-size:24px;line-height:1.1}
.tag{font:500 13px var(--font-display);padding:3px 12px;border-radius:var(--radius-pill);border:1px solid var(--base-softer);color:var(--base-soft)}
.dim{margin-left:auto;font:400 14px var(--font-display);color:var(--base-soft)}
.stage{background:var(--hover-subtle);margin:0 24px;border-radius:var(--radius-img);padding:24px;
  display:flex;justify-content:center;align-items:flex-start;min-height:200px}
.frame{position:relative;background:#fff;box-shadow:0 0 0 1px var(--base-softest);overflow:hidden;flex:none}
.frame iframe,.frame img{position:absolute;inset:0;border:0;display:block;transform-origin:0 0;background:#fff}
.frame img{object-fit:contain}
.item-note{padding:16px 24px 0;font-size:14px;color:var(--base-soft)}
.item-tools{display:flex;gap:12px;padding:16px 24px 24px;margin-top:auto}

/* ---------- comments ---------- */
.thread{border-left:1px solid var(--base-softest);display:flex;flex-direction:column;min-height:0;max-height:680px}
.thread h3{font-size:18px;padding:20px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--base-softest)}
.count{background:var(--accent-fill);color:var(--accent-ink);border-radius:var(--radius-pill);font:500 13px var(--font-display);padding:2px 12px}
.list{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
.list li{padding:16px 24px;border-bottom:1px solid var(--base-softest)}
.list li.resolved .txt{color:var(--base-softer);text-decoration:line-through}
.meta{display:flex;gap:8px;align-items:baseline;font:400 13px var(--font-display);color:var(--base-soft);margin-bottom:4px}
.meta b{color:var(--base);font-weight:600;font-size:14px}
.meta .tc{margin-left:auto}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.empty{padding:24px;color:var(--base-soft)}
.link{background:none;border:0;padding:0;margin-top:8px;font:400 13px var(--font-display);color:var(--base-soft);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--base)}
.add{padding:16px 24px 24px;border-top:1px solid var(--base-softest);display:grid;gap:12px}
.add textarea{width:100%;min-height:88px;resize:vertical;padding:12px 16px;border-radius:var(--radius-card);
  background:transparent;border:1px solid var(--base-softest)}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hint{font:400 13px var(--font-display);white-space:nowrap;color:var(--base-soft)}

footer{max-width:1280px;margin:0 auto;padding:0 clamp(16px,4vw,40px) 40px;color:var(--base-soft);font-size:14px}

@media (max-width:900px){
  .bar{position:static}
  .review{grid-template-columns:1fr}
  .thread{border-left:0;border-top:1px solid var(--base-softest);max-height:none}
  .field{width:150px}
  .dim{margin-left:0}
}
@media (max-width:560px){ .rule{display:none} .lockup{gap:0;flex-direction:column;align-items:flex-start;gap:10px} }
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

<script>
/* =====================================================================
   1. CONFIGURE YOUR REVIEW HERE
   ===================================================================== */
const CONFIG = {
  projectId: "spring-campaign-r1",      // change per round: keeps comments separate
  title: "Spring campaign",
  subtitle: "Round 1 review",

  // Optional: paste your Google Apps Script web-app URL to share comments
  // between all reviewers (see README). Leave "" to save comments only in
  // each reviewer's own browser.
  endpoint: "",

  items: [
    // type: "html" (HTML5 banner or page) or "svg"
    // src: path or URL, relative to this file when hosted together.
    // width/height: native size of the creative in pixels.
    {
      id: "banner-300x250",
      title: "Display banner",
      type: "html",
      width: 300, height: 250,
      note: "HTML5 sample. Replace it with your own banner.",
      inline: `<!doctype html><meta charset=utf-8>
      <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500&display=swap" rel="stylesheet">
      <style>
        html,body{margin:0;height:100%}
        .b{width:300px;height:250px;background:#0A211F;color:#F7F9F2;position:relative;overflow:hidden;font-family:'Inter Tight',Arial,sans-serif}
        .c{position:absolute;border-radius:50%}
        .c1{width:150px;height:150px;right:-40px;top:-40px;background:#D8FF85;animation:f 4s ease-in-out infinite}
        .c2{width:64px;height:64px;left:24px;bottom:-24px;background:#8DFDBA;animation:f 3s ease-in-out infinite reverse}
        h1{position:absolute;left:24px;top:84px;margin:0;font-size:36px;font-weight:500;line-height:.95;width:220px;letter-spacing:-.01em}
        a{position:absolute;right:20px;bottom:20px;background:#D8FF85;color:#0A211F;padding:12px 22px;font-weight:500;font-size:14px;text-decoration:none;border-radius:999px}
        @keyframes f{50%{transform:translateY(14px) scale(1.06)}}
        @media (prefers-reduced-motion:reduce){.c{animation:none}}
      </style>
      <div class=b><div class="c c1"></div><div class="c c2"></div><h1>Scale without the chaos</h1><a href="#">See how</a></div>`
    },
    {
      id: "logo-icon",
      title: "Logo icon",
      type: "svg",
      width: 400, height: 300,
      note: "SVG sample: the Superside icon, Spark on Pine.",
      inline: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><rect width="400" height="300" fill="#0A211F"/><svg x="146" y="90" width="108" height="97" viewBox="0 0 1203 1080"><path d="M757.51 663.02C754.54 619.76 732.92 576.46 697.36 551.37L570.14 458.48C557.75 448.99 549.87 434.78 548.85 419.91C547.32 397.61 561.47 362.5 601.53 362.6C615.34 362.63 625.29 366.71 637.59 374.85L701.52 420.96C730.58 441.98 809.77 486.86 888.51 423.19C946.89 375.99 932.79 293.13 925.64 279.6L829.14 279.36C838.26 291.55 838.64 299.66 839.34 309.8C841.34 338.86 824.45 361.11 792.68 361.04C779.56 361.01 769.61 356.93 734.84 333.19L689.89 301.99C661.61 282.32 627.63 270.08 596.55 270C531.64 269.84 447.56 322.35 454.06 416.97C457.08 460.9 478.61 502.85 514.21 528.62L640.74 621.51C653.82 631 661.66 644.54 662.68 659.41C664.26 682.39 650.1 717.5 610.05 717.4C596.24 717.37 586.29 713.29 573.99 705.15L510.06 659.04C481 638.02 444.34 627.12 409.12 627.03C323.49 626.82 265.66 689.53 270.26 756.44C271.24 770.63 275.11 786.86 282.26 800.4L378.76 800.64C369.64 788.45 369.26 780.34 368.56 770.2C366.56 741.14 387.13 718.89 418.89 718.96C432.01 718.99 441.96 723.07 476.73 746.81L521.68 778.01C549.96 797.68 583.94 809.92 615.02 810C679.93 810.16 764.01 757.65 757.51 663.03V663.02Z" fill="#D8FF85"/></svg></svg>`
    }
    /* Your own files, for example:
    { id:"hero", title:"Homepage hero", type:"html", src:"assets/hero/index.html", width:1280, height:720 },
    { id:"icon", title:"App icon",      type:"svg",  src:"assets/icon.svg",       width:512,  height:512 },
    */
  ]
};

/* =====================================================================
   2. APP CODE
   ===================================================================== */
const $ = (s, r=document) => r.querySelector(s);
const el = (tag, props={}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  kids.flat().forEach(k => n.append(k));
  return n;
};
const KEY = "review:" + CONFIG.projectId;
const NAME_KEY = "review:reviewer";
let comments = [];
let sessionItems = [];           // local previews, not saved

/* ---- storage ---- */
function loadLocal(){
  try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch { return []; }
}
function saveLocal(){
  try { localStorage.setItem(KEY, JSON.stringify(comments)); } catch {}
}
function merge(remote){
  const have = new Set(comments.map(c => c.id));
  remote.forEach(c => { if(!have.has(c.id)) comments.push(c); });
  comments.sort((a,b) => a.ts - b.ts);
}

/* ---- sync status ---- */
function setSync(state, text){
  const s = $("#sync");
  s.className = "sync " + (state || "");
  s.lastElementChild.textContent = text;
}
async function pull(){
  if(!CONFIG.endpoint) return;
  try{
    setSync("", "Syncing…");
    const r = await fetch(CONFIG.endpoint);
    const data = await r.json();
    if(Array.isArray(data)){ merge(data.map(normalize)); saveLocal(); renderAllThreads(); }
    setSync("ok", "Shared with all reviewers");
  }catch(e){ setSync("err", "Can't reach the shared sheet"); }
}
async function push(c){
  if(!CONFIG.endpoint) return;
  try{
    // text/plain avoids a CORS preflight, which Apps Script doesn't answer
    await fetch(CONFIG.endpoint, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(c)});
    setSync("ok", "Comment shared");
  }catch(e){ setSync("err", "Saved on this device. Sharing failed."); }
}
const normalize = c => ({id:String(c.id), itemId:String(c.itemId), name:String(c.name||""), text:String(c.text||""), ts:Number(c.ts)||0, resolved:!!c.resolved});

/* ---- render ---- */
function fmtTime(ts){
  return new Date(ts).toLocaleString(undefined, {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
}
function itemsAll(){ return [...CONFIG.items, ...sessionItems]; }

function buildFrame(item){
  const frame = el("div", {className:"frame"});
  frame.style.aspectRatio = item.width + " / " + item.height;
  if(item.type === "svg"){
    const img = el("img", {alt: item.title});
    img.src = item.inline ? "data:image/svg+xml;charset=utf-8," + encodeURIComponent(item.inline) : item.src;
    frame.append(img);
  } else {
    const f = el("iframe", {title: item.title, loading:"lazy"});
    f.width = item.width; f.height = item.height;
    f.style.width = item.width + "px"; f.style.height = item.height + "px";
    f.setAttribute("sandbox", "allow-scripts allow-same-origin allow-popups");
    if(item.inline) f.srcdoc = item.inline; else f.src = item.src;
    frame.append(f);
  }
  return frame;
}

/* scale the frame down when the stage is narrower than the creative */
function fit(stage, frame, item){
  const apply = () => {
    const avail = stage.clientWidth - 48;
    const scale = Math.min(1, avail / item.width);
    frame.style.width  = item.width  * scale + "px";
    frame.style.height = item.height * scale + "px";
    const inner = frame.firstElementChild;
    if(inner.tagName === "IFRAME") inner.style.transform = `scale(${scale})`;
    else { inner.style.width = "100%"; inner.style.height = "100%"; }
  };
  new ResizeObserver(apply).observe(stage);
  apply();
}

function renderItem(item){
  const stage = el("div", {className:"stage"});
  const frame = buildFrame(item);
  stage.append(frame);

  const tools = el("div", {className:"item-tools"});
  if(item.type === "html"){
    tools.append(el("button", {className:"btn btn--isolated", type:"button", textContent:"Replay", onclick:() => {
      const inner = frame.firstElementChild;
      if(item.inline){ inner.srcdoc = ""; setTimeout(() => inner.srcdoc = item.inline, 30); } else inner.src = inner.src;
    }}));
  }
  if(item.src) tools.append(el("a", {className:"btn btn--isolated", href:item.src, target:"_blank", rel:"noopener", textContent:"Open full size"}));

  const left = el("div", {className:"stage-wrap"},
    el("div", {className:"item-head"},
      el("h2", {textContent:item.title}),
      el("span", {className:"tag", textContent: item.type === "svg" ? "SVG" : "HTML5"}),
      el("span", {className:"dim", textContent: item.width + " × " + item.height + " px"})
    ),
    stage,
    item.note ? el("div", {className:"item-note", textContent:item.note}) : "",
    tools.children.length ? tools : ""
  );

  const list = el("ul", {className:"list"});
  const count = el("span", {className:"count", textContent:"0 open"});
  const ta = el("textarea", {placeholder:"What should change? Be specific.", id:"ta-"+item.id});
  ta.setAttribute("aria-label", "Comment on " + item.title);
  ta.addEventListener("input", () => ta.classList.remove("error"));
  const form = el("div", {className:"add"},
    ta,
    el("div", {className:"actions"},
      el("span", {className:"hint", textContent:"Ctrl/⌘ + Enter to post"}),
      el("button", {className:"btn btn--primary", type:"button", textContent:"Post comment", onclick:() => post(item, ta)})
    )
  );
  ta.addEventListener("keydown", e => { if((e.ctrlKey||e.metaKey) && e.key==="Enter") post(item, ta); });

  const thread = el("aside", {className:"thread"},
    el("h3", {}, "Comments", count), list, form);
  thread.setAttribute("aria-label", "Comments on " + item.title);
  thread.dataset.item = item.id;

  const card = el("section", {className:"review", id:"item-"+item.id}, left, thread);
  requestAnimationFrame(() => fit(stage, frame, item));
  return card;
}

function renderThread(itemId){
  const thread = document.querySelector(`.thread[data-item="${CSS.escape(itemId)}"]`);
  if(!thread) return;
  const list = $(".list", thread);
  const mine = comments.filter(c => c.itemId === itemId);
  $(".count", thread).textContent = mine.filter(c => !c.resolved).length + " open";
  list.replaceChildren();
  if(!mine.length){ list.append(el("li", {className:"empty", textContent:"No comments yet. Add the first one below."})); return; }
  mine.forEach(c => {
    const li = el("li", {className: c.resolved ? "resolved" : ""},
      el("div", {className:"meta"}, el("b", {textContent:c.name}), el("span", {className:"tc", textContent:fmtTime(c.ts)})),
      el("div", {className:"txt", textContent:c.text}),
      el("button", {className:"link", type:"button", textContent: c.resolved ? "Reopen" : "Mark resolved", onclick:() => { c.resolved = !c.resolved; saveLocal(); renderThread(itemId); }})
    );
    list.append(li);
  });
  list.scrollTop = list.scrollHeight;
}
function renderAllThreads(){ itemsAll().forEach(i => renderThread(i.id)); }

function renderFeed(){
  const feed = $("#feed");
  feed.replaceChildren(...itemsAll().map(renderItem));
  renderAllThreads();
}

/* ---- actions ---- */
function post(item, ta){
  const nameEl = $("#reviewer");
  const name = nameEl.value.trim();
  const text = ta.value.trim();
  if(!name){ nameEl.classList.add("error"); nameEl.focus(); setSync("err", "Add your name to comment"); return; }
  if(!text){ ta.classList.add("error"); ta.focus(); return; }
  const c = {id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), itemId:item.id, name, text, ts:Date.now(), resolved:false};
  comments.push(c); saveLocal();
  ta.value = "";
  renderThread(item.id);
  if(CONFIG.endpoint) push(c); else setSync("", "Comment saved on this device");
}

function exportComments(){
  const rows = [["item","reviewer","date","status","comment"]];
  const titles = Object.fromEntries(itemsAll().map(i => [i.id, i.title]));
  comments.slice().sort((a,b)=>a.ts-b.ts).forEach(c => rows.push([titles[c.itemId]||c.itemId, c.name, new Date(c.ts).toISOString(), c.resolved?"resolved":"open", c.text]));
  const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(",")).join("\n");
  const a = el("a", {href: URL.createObjectURL(new Blob(["\ufeff"+csv], {type:"text/csv"})), download: CONFIG.projectId + "-comments.csv"});
  document.body.append(a); a.click(); a.remove();
}

function previewLocal(file){
  const reader = new FileReader();
  reader.onload = () => {
    const txt = String(reader.result);
    const isSvg = /\.svg$/i.test(file.name);
    let w = 600, h = 400;
    if(isSvg){
      const m = txt.match(/viewBox="[\d.\s-]+?([\d.]+)\s+([\d.]+)"/);
      if(m){ w = Math.round(+m[1]); h = Math.round(+m[2]); }
    }
    const size = prompt("Size of this creative in pixels (width x height)", w + "x" + h) || (w + "x" + h);
    const [ww, hh] = size.split(/[x×,\s]+/).map(Number);
    sessionItems.push({id:"local-" + Date.now(), title:file.name, type:isSvg?"svg":"html", width:ww||w, height:hh||h, inline:txt, note:"Local preview. It isn't saved. Add the file to your config to keep it."});
    renderFeed();
    window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"});
  };
  reader.readAsText(file);
}

/* ---- init ---- */
document.title = CONFIG.title + " · Creative review";
$("#projectTitle").textContent = CONFIG.title;
$("#projectSub").textContent = CONFIG.subtitle || "";
$("#foot").textContent = CONFIG.endpoint
  ? "Comments are shared with everyone who has this link."
  : "Comments save in this browser only. Use Export comments to send them back.";

const nameInput = $("#reviewer");
try { nameInput.value = localStorage.getItem(NAME_KEY) || ""; } catch {}
nameInput.addEventListener("input", () => { nameInput.classList.remove("error"); if($("#sync").classList.contains("err")) setSync("", CONFIG.endpoint ? "Shared with all reviewers" : "Comments save on this device"); });
nameInput.addEventListener("change", () => { try { localStorage.setItem(NAME_KEY, nameInput.value.trim()); } catch {} });

$("#exportBtn").onclick = exportComments;
$("#localBtn").onclick = () => $("#localFile").click();
$("#localFile").onchange = e => { if(e.target.files[0]) previewLocal(e.target.files[0]); e.target.value = ""; };

comments = loadLocal().map(normalize);
if(!CONFIG.endpoint) setSync("", "Comments save on this device");
renderFeed();
pull();
if(CONFIG.endpoint) setInterval(pull, 30000);
</script>
</body>
</html>
